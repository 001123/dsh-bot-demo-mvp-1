# T9 — GitHub Pages deployment.
#
# NOT ENABLED AND NOT RUN. This file only exists so it can be reviewed; the repository's
# Pages site is still off (`has_pages: false`) and nothing here fires by itself.
#
# Safety notes, written for the reviewer:
#   * Trigger is `workflow_dispatch` ONLY. No push, no schedule, no pull_request. The plan
#     allows switching to `push: main` only after the user says "Duyệt" at GATE 2.
#   * The build job runs code from this repository (`npm install`, `npm run build`). That is
#     why this workflow must never gain `contents: write`, and why an untrusted trigger must
#     never reach it — the 2026-10-11 review of `generate-lockfile.yml` found exactly that
#     class of hole (write token in the same job that executes repo code).
#   * `pages: write` and `id-token: write` are the minimum the official Pages actions need;
#     they belong to the deploy job, not to the build job.
#   * No lockfile is committed (user decision, plan bản 10 P7), so install uses
#     `npm install --include=dev` — `npm ci` cannot work here.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
